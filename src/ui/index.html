<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fattern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ── Theme detection: run before paint to avoid flash ── -->
    <script>
      (function () {
        var LIGHT_THEMES = { light: 1, ocean: 1, forest: 1, sunset: 1, slate: 1 };
        var saved = localStorage.getItem('fattern:theme');
        if (saved && LIGHT_THEMES[saved]) {
          document.documentElement.setAttribute('data-loading-theme', 'light');
        }
      })();
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; }

      /* ── Loading screen ── */
      #loading-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.35s ease;
        /* Dark defaults */
        --ls-bg:           linear-gradient(160deg, #0d1a14 0%, #111820 50%, #0e1118 100%);
        --ls-orb1:         rgba(45,180,130,0.30);
        --ls-orb2:         rgba(80,140,220,0.20);
        --ls-titlebar:     rgba(0,0,0,0.25);
        --ls-title-color:  rgba(255,255,255,0.75);
        --ls-tile-bg:      rgba(255,255,255,0.06);
        --ls-tile-border:  rgba(255,255,255,0.10);
        --ls-tile-shadow1: rgba(45,180,130,0.15);
        --ls-tile-shadow2: rgba(45,180,130,0.32);
        --ls-bar-track:    rgba(255,255,255,0.08);
        --ls-bar-fill:     linear-gradient(90deg, #2abd8a, rgba(63,217,160,0.50));
        --ls-label-color:  rgba(255,255,255,0.28);
      }

      /* Light override */
      [data-loading-theme="light"] #loading-screen {
        --ls-bg:           linear-gradient(160deg, #F0F7F3 0%, #EEF3F9 50%, #F2EFF8 100%);
        --ls-orb1:         rgba(45,180,130,0.10);
        --ls-orb2:         rgba(80,140,220,0.08);
        --ls-titlebar:     rgba(255,255,255,0.60);
        --ls-title-color:  rgba(26,31,28,0.55);
        --ls-tile-bg:      rgba(255,255,255,0.65);
        --ls-tile-border:  rgba(255,255,255,0.90);
        --ls-tile-shadow1: rgba(0,0,0,0.05);
        --ls-tile-shadow2: rgba(45,180,130,0.14);
        --ls-bar-track:    rgba(0,0,0,0.08);
        --ls-bar-fill:     linear-gradient(90deg, #2abd8a, rgba(45,180,130,0.45));
        --ls-label-color:  rgba(0,0,0,0.30);
      }

      #loading-screen.fade-out { opacity: 0; pointer-events: none; }

      /* Background */
      #ls-bg {
        position: absolute; inset: 0;
        background: var(--ls-bg);
      }

      /* Ambient orbs */
      #ls-orb1, #ls-orb2 {
        position: absolute; border-radius: 50%; filter: blur(60px);
        animation: lsOrbPulse 3.5s ease-in-out infinite;
      }
      #ls-orb1 {
        width: 380px; height: 380px;
        background: var(--ls-orb1);
        top: -100px; left: -80px;
      }
      #ls-orb2 {
        width: 300px; height: 300px;
        background: var(--ls-orb2);
        bottom: -80px; right: -20px;
        animation-delay: 1.2s;
      }
      @keyframes lsOrbPulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50%       { opacity: 1;   transform: scale(1.1); }
      }

      /* Titlebar */
      #ls-titlebar {
        position: relative; z-index: 1;
        height: 40px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: var(--ls-titlebar);
        backdrop-filter: blur(20px);
        -webkit-app-region: drag;
      }
      #ls-titlebar span {
        font-size: 13px; font-weight: 500;
        color: var(--ls-title-color);
        letter-spacing: -0.01em;
      }

      /* Centre content */
      #ls-content {
        position: relative; z-index: 1;
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 0;
      }

      /* Logo tile */
      #ls-tile {
        padding: 18px; border-radius: 24px;
        background: var(--ls-tile-bg);
        border: 1px solid var(--ls-tile-border);
        backdrop-filter: blur(16px) saturate(1.3);
        box-shadow: 0 0 28px var(--ls-tile-shadow1);
        animation: lsTileGlow 2.8s ease-in-out infinite;
      }
      @keyframes lsTileGlow {
        0%, 100% { box-shadow: 0 0 24px var(--ls-tile-shadow1); }
        50%       { box-shadow: 0 0 48px var(--ls-tile-shadow2); }
      }
      #ls-logo {
        width: 72px; height: 72px;
        display: block; object-fit: contain;
      }

      /* Progress area */
      #ls-progress {
        margin-top: 36px; width: 200px;
      }
      #ls-bar-track {
        height: 2px; border-radius: 2px;
        background: var(--ls-bar-track);
        overflow: hidden;
      }
      #ls-bar-fill {
        height: 100%; width: 0%; border-radius: 2px;
        background: var(--ls-bar-fill);
        transition: width 0.18s ease;
      }
      #ls-label {
        margin-top: 10px; text-align: center;
        font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
        font-family: 'DM Mono', ui-monospace, monospace;
        color: var(--ls-label-color);
      }

      /* Root hidden until React takes over */
      #root { display: none; opacity: 0; transition: opacity 0.25s ease; }
      #root.ready { display: block; }
      #root.visible { opacity: 1; }
    </style>
  </head>

  <body class="bg-cloud text-ink">

    <div id="loading-screen">
      <div id="ls-bg"></div>
      <div id="ls-orb1"></div>
      <div id="ls-orb2"></div>

      <div id="ls-titlebar">
        <span>Fattern</span>
      </div>

      <div id="ls-content">
        <div id="ls-tile">
          <img id="ls-logo" src="/logo.png" alt="Fattern" />
        </div>
        <div id="ls-progress">
          <div id="ls-bar-track">
            <div id="ls-bar-fill"></div>
          </div>
          <div id="ls-label">Initialiserer · 0%</div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      var progress  = 0;
      var barFill   = document.getElementById('ls-bar-fill');
      var label     = document.getElementById('ls-label');

      var ticker = setInterval(function () {
        progress = Math.min(progress + Math.random() * 14, 95);
        if (barFill) barFill.style.width = progress + '%';
        if (label)   label.textContent   = 'Initialiserer · ' + Math.round(progress) + '%';
      }, 160);

      window.hideLoadingScreen = function () {
        clearInterval(ticker);
        var screen = document.getElementById('loading-screen');
        var root   = document.getElementById('root');

        // Finish the bar
        if (barFill) barFill.style.width = '100%';
        if (label)   label.textContent   = 'Initialiserer · 100%';

        // Show root behind the fade
        if (root) root.classList.add('ready');

        setTimeout(function () {
          // Fade the loading screen out
          if (screen) {
            screen.classList.add('fade-out');
            screen.addEventListener('transitionend', function () {
              screen.style.display = 'none';
            }, { once: true });
          }
          // Fade the app in
          if (root) {
            requestAnimationFrame(function () {
              root.classList.add('visible');
            });
          }
        }, 120); // brief pause so 100% registers visually
      };
    </script>
  </body>
</html>
